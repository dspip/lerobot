[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "fault_system"
version = "0.1.0"
description = "Fault injection, recovery datagen, and eval recording on top of a pinned LeRobot."
license = { text = "Apache-2.0" }
requires-python = ">=3.12"
authors = [{ name = "Gangelia" }]
dependencies = [
    "lerobot[dataset,test,dev,libero,smolvla] @ git+https://github.com/huggingface/lerobot.git@e0d50211ef236143ae867228662b7dfaba554f02",
    "lerobot_env_libero_overlay",
]

[project.scripts]
lerobot-eval-faults = "fault_system.eval_cli:main"

[tool.uv.workspace]
members = ["packages/lerobot_env_libero_overlay"]

# ---------------- Tool Configurations ----------------

# cu128 wheels keep broad hardware reach; the driver floor is 570.86.
# To use a different CUDA variant, reinstall torch with an explicit index, e.g.:
#   uv pip install --force-reinstall torch torchvision \
#       --index-url https://download.pytorch.org/whl/cu130
[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
lerobot_env_libero_overlay = { workspace = true }
torch = [{ index = "pytorch-cu128", marker = "sys_platform == 'linux'" }]
torchvision = [{ index = "pytorch-cu128", marker = "sys_platform == 'linux'" }]

[tool.setuptools.packages.find]
where = ["src"]
include = ["fault_system*"]

[tool.ruff]
target-version = "py312"
line-length = 110
exclude = ["tests/artifacts/**/*.safetensors", "*_pb2.py", "*_pb2_grpc.py"]

[tool.ruff.lint]
# E, W: pycodestyle errors and warnings
# F: PyFlakes
# I: isort
# UP: pyupgrade
# B: flake8-bugbear (good practices, potential bugs)
# C4: flake8-comprehensions (more concise comprehensions)
# A: flake8-builtins (shadowing builtins)
# SIM: flake8-simplify
# RUF: Ruff-specific rules
# D: pydocstyle (for docstring style/formatting)
# S: flake8-bandit (some security checks, complements Bandit)
# T20: flake8-print (discourage print statements in production code)
# N: pep8-naming
# TODO: Uncomment rules when ready to use
select = [
    "E", "W", "F", "I", "B", "C4", "T20", "N", "UP", "SIM", "D" #, "A", "S", "RUF"
]
ignore = [
    "E501", # Line too long
    "T201", # Print statement found
    "T203", # Pprint statement found
    "B008", # Perform function call in argument defaults
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401", "F403", "E402", "D104"]
# E402: conditional-import guards (TYPE_CHECKING / is_package_available) must precede the imports they protect
"src/lerobot/scripts/convert_dataset_v21_to_v30.py" = ["E402"]

# D (pydocstyle) is enabled globally, but only holds for code that has been converted to the docstring
# standard in docs/source/writing_docstrings.mdx. Every module below is still on the old style; each entry
# is deleted as that module is converted, and this block can be removed once it is empty.
#
# Not part of the API reference and not planned for conversion: tests, examples, benchmarks, templates,
# CI helper scripts and the packaging shim.
"tests/**" = ["D"]
"examples/**" = ["D"]
"benchmarks/**" = ["D"]
"scripts/**" = ["D"]
"setup.py" = ["D"]
"src/lerobot/templates/**" = ["D"]
# Vendored from transformers; keeps its upstream docstring style so syncs stay clean.
"src/lerobot/policies/molmoact2/molmoact2_hf_model/**" = ["D"]
# Awaiting conversion, one PR per module.
"src/lerobot/annotations/**" = ["D"]
"src/lerobot/async_inference/**" = ["D"]
"src/lerobot/cameras/**" = ["D"]
"src/lerobot/common/**" = ["D"]
"src/lerobot/configs/**" = ["D"]
"src/lerobot/data_processing/**" = ["D"]
"src/lerobot/datasets/**" = ["D"]
"src/lerobot/distributed/**" = ["D"]
"src/lerobot/envs/**" = ["D"]
"src/lerobot/jobs/**" = ["D"]
"src/lerobot/model/**" = ["D"]
"src/lerobot/motors/**" = ["D"]
"src/lerobot/optim/**" = ["D"]
"src/lerobot/policies/**" = ["D"]
"src/lerobot/processor/**" = ["D"]
"src/lerobot/rewards/**" = ["D"]
"src/lerobot/rl/**" = ["D"]
"src/lerobot/robots/**" = ["D"]
"src/lerobot/rollout/**" = ["D"]
"src/lerobot/scripts/**" = ["D"]
"src/lerobot/teleoperators/**" = ["D"]
"src/lerobot/transforms/**" = ["D"]
"src/lerobot/transport/**" = ["D"]
"src/lerobot/utils/**" = ["D"]
"src/lerobot/lerobot_types.py" = ["D"]
# Package root: two one-line docstring fixes land with the docstring PR.
"src/lerobot/__init__.py" = ["D"]
"src/lerobot/__version__.py" = ["D"]
[tool.ruff.lint.isort]
combine-as-imports = true
known-first-party = ["lerobot", "fault_system", "lerobot_env_libero_overlay"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
docstring-code-format = true

[tool.bandit]
exclude_dirs = [
    "tests",
    "benchmarks",
    "src/lerobot/datasets/push_dataset_to_hub",
]
skips = ["B101", "B311", "B404", "B603", "B615"]

[tool.typos]
default.extend-ignore-re = [
    "(?Rm)^.*(#|//)\\s*spellchecker:disable-line$",                      # spellchecker:disable-line
    "(?s)(#|//)\\s*spellchecker:off.*?\\n\\s*(#|//)\\s*spellchecker:on", # spellchecker:<on|off>
]
default.extend-ignore-identifiers-re = [
    # Add individual words here to ignore them
    "2nd",
    "pn",
    "ser",
    "ein",
    "thw",
    "inpt",
    "arange",
    "is_compileable",
    "ROBOTIS",
    "OT_VALUE",
    "VanderBilt",
    "seperated_timestep",
    "nd",  # einsum output axes "...nd" in the vendored FLUX 3 Action transformer
    "EmbedND",
]
default.extend-words = { nd = "nd" }

# Docstring coverage gate. `fail-under` is a RATCHET, not a target: it is set just below the currently
# measured coverage so it passes today, and is raised in the same PR that documents a module. Never set it
# to a value that fails on main. The destination is 100; see docs/source/writing_docstrings.mdx.
[tool.interrogate]
ignore-init-module = true
ignore-init-method = true
ignore-nested-functions = false
ignore-magic = false
ignore-semiprivate = false
ignore-private = false
ignore-property-decorators = false
ignore-module = false
ignore-setters = false
fail-under = 52
output-format = "term-missing"
color = true
paths = ["src/fault_system", "packages/lerobot_env_libero_overlay/src"]
exclude = ["src/lerobot/policies/molmoact2/molmoact2_hf_model"]

[tool.pytest.ini_options]
markers = [
    "multigpu: distributed tests needing 2-4 GPUs (CI: docker_publish.yml lane)",
    "multigpu_heavy: 8-GPU sweeps and soak tests; never run in CI",
]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
follow_imports = "skip"
# Paths the hook checks as a whole (pass_filenames: false); keep its `files` pattern in sync.
files = ["src/fault_system", "packages/lerobot_env_libero_overlay/src", "scripts", "conftest.py"]
exclude = ['_pb2(_grpc)?\.py$']
exclude_gitignore = true
warn_redundant_casts = true
extra_checks = true
strict_bytes = true
strict_equality = true
local_partial_types = true
implicit_reexport = false
warn_unused_ignores = true
enable_error_code = [
    "deprecated",
    "exhaustive-match",
    "ignore-without-code",
    "redundant-self",
    "truthy-bool",
    "truthy-iterable",
    "unused-awaitable",
]
# Next candidates, each needing a fix PR first (error counts as of 2026-09):
# warn_unreachable = true          # 40: dead code, mostly unannotated `self.x = None` attributes
# strict_equality_for_none = true  # 40: keep None guards on config fields, `--field=null` yields None
# check_untyped_defs = true        # 195: most valuable; decide first how Optional dataset metadata is accessed

# One ruleset for all checked code. Excluded: lerobot.rl (not typed yet) and the vendored
# molmoact2_hf_model (kept verbatim so upstream syncs stay clean).
[[tool.mypy.overrides]]
module = ["lerobot.rl.*", "lerobot.policies.molmoact2.molmoact2_hf_model.*"]
ignore_errors = true
