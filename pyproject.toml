[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "fault_system"
version = "0.1.0"
description = "Fault injection, recovery datagen, and eval recording on top of a pinned LeRobot."
license = { text = "Apache-2.0" }
requires-python = ">=3.12"
authors = [{ name = "Gangelia" }]
dependencies = [
    "lerobot[dataset,test,dev,libero,smolvla] @ git+https://github.com/huggingface/lerobot.git@e0d50211ef236143ae867228662b7dfaba554f02",
    "lerobot_env_libero_overlay",
]

[project.scripts]
lerobot-eval-faults = "fault_system.eval_cli:main"

[tool.uv.workspace]
members = ["packages/lerobot_env_libero_overlay"]

# ---------------- Tool Configurations ----------------

# cu128 wheels keep broad hardware reach; the driver floor is 570.86.
# To use a different CUDA variant, reinstall torch with an explicit index, e.g.:
#   uv pip install --force-reinstall torch torchvision \
#       --index-url https://download.pytorch.org/whl/cu130
[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
lerobot_env_libero_overlay = { workspace = true }
torch = [{ index = "pytorch-cu128", marker = "sys_platform == 'linux'" }]
torchvision = [{ index = "pytorch-cu128", marker = "sys_platform == 'linux'" }]

[tool.setuptools.packages.find]
where = ["src"]
include = ["fault_system*"]

[tool.ruff]
target-version = "py312"
line-length = 110
exclude = ["tests/artifacts/**/*.safetensors", "*_pb2.py", "*_pb2_grpc.py"]

[tool.ruff.lint]
# E, W: pycodestyle errors and warnings
# F: PyFlakes
# I: isort
# UP: pyupgrade
# B: flake8-bugbear (good practices, potential bugs)
# C4: flake8-comprehensions (more concise comprehensions)
# A: flake8-builtins (shadowing builtins)
# SIM: flake8-simplify
# RUF: Ruff-specific rules
# D: pydocstyle (for docstring style/formatting)
# S: flake8-bandit (some security checks, complements Bandit)
# T20: flake8-print (discourage print statements in production code)
# N: pep8-naming
# TODO: Uncomment rules when ready to use
select = [
    "E", "W", "F", "I", "B", "C4", "T20", "N", "UP", "SIM", "D" #, "A", "S", "RUF"
]
ignore = [
    "E501", # Line too long
    "T201", # Print statement found
    "T203", # Pprint statement found
    "B008", # Perform function call in argument defaults
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401", "F403", "E402", "D104"]
"tests/**" = ["D"]
"examples/**" = ["D"]
"scripts/**" = ["D"]
[tool.ruff.lint.isort]
combine-as-imports = true
known-first-party = ["lerobot", "fault_system", "lerobot_env_libero_overlay"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
docstring-code-format = true

[tool.bandit]
exclude_dirs = ["tests"]
skips = ["B101", "B311", "B404", "B603", "B615"]

[tool.typos]
default.extend-ignore-re = [
    "(?Rm)^.*(#|//)\\s*spellchecker:disable-line$",                      # spellchecker:disable-line
    "(?s)(#|//)\\s*spellchecker:off.*?\\n\\s*(#|//)\\s*spellchecker:on", # spellchecker:<on|off>
]
default.extend-ignore-identifiers-re = [
    # Add individual words here to ignore them
    "2nd",
    "pn",
    "ser",
    "ein",
    "thw",
    "inpt",
    "arange",
    "is_compileable",
    "ROBOTIS",
    "OT_VALUE",
    "VanderBilt",
    "seperated_timestep",
    "nd",  # einsum output axes "...nd" in the vendored FLUX 3 Action transformer
    "EmbedND",
]
default.extend-words = { nd = "nd" }

# Docstring coverage gate. `fail-under` is a RATCHET, not a target: it is set just below the currently
# measured coverage so it passes today, and is raised in the same PR that documents a module. Never set it
# to a value that fails on main. The destination is 100; see docs/source/writing_docstrings.mdx.
[tool.interrogate]
ignore-init-module = true
ignore-init-method = true
ignore-nested-functions = false
ignore-magic = false
ignore-semiprivate = false
ignore-private = false
ignore-property-decorators = false
ignore-module = false
ignore-setters = false
fail-under = 52
output-format = "term-missing"
color = true
paths = ["src/fault_system", "packages/lerobot_env_libero_overlay/src"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
follow_imports = "skip"
# Paths the hook checks as a whole (pass_filenames: false); keep its `files` pattern in sync.
files = ["src/fault_system", "packages/lerobot_env_libero_overlay/src", "scripts"]
exclude = ['_pb2(_grpc)?\.py$']
exclude_gitignore = true
warn_redundant_casts = true
extra_checks = true
strict_bytes = true
strict_equality = true
local_partial_types = true
implicit_reexport = false
warn_unused_ignores = true
enable_error_code = [
    "deprecated",
    "exhaustive-match",
    "ignore-without-code",
    "redundant-self",
    "truthy-bool",
    "truthy-iterable",
    "unused-awaitable",
]